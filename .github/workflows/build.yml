name: build
on:
  push:
    branches: [main]
    tags: ['[0-9][0-9].[0-9][0-9][0-9].[0-9][0-9][0-9]']
  pull_request:
permissions:
  contents: write
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update-engine tests (mock server, no console data needed)
        run: |
          mkdir -p build
          MZ="-DMINIZ_NO_STDIO -DMINIZ_NO_ARCHIVE_WRITING_APIS -DMINIZ_NO_TIME -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES -Ithird_party/miniz"
          cc -std=gnu11 -O2 -Wall -Wextra $MZ tools/updcli.c core/rr_ctx.c core/rr_update.c core/rr_zip.c third_party/miniz/miniz.c -o build/updcli
          bash tests/e2e_update.sh "$PWD/build/updcli"
  build-app:
    runs-on: ubuntu-24.04
    needs: host-tests
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 python3 python3-pil cmake ninja-build
      - name: Build title folder
        run: tools/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PPSA97531
          path: dist/PPSA97531.zip
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PPSA97531.zip
          generate_release_notes: true
